<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sitio bloqueado – FocusTime</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <div class="bg-canvas">
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>
  </div>

  <div class="card">
    <span class="shield">🛡️</span>
    <h1 class="title">Sitio bloqueado</h1>
    <div class="domain-pill">
      <img class="domain-favicon" id="domain-favicon" src="" alt="" />
      <span id="blocked-domain">—</span>
    </div>
    <p class="subtitle">
      FocusTime está protegiendo tu tiempo.<br />
      Este sitio está bloqueado en este horario.
    </p>
    <button class="btn-back" onclick="history.back()">← Volver</button>
    <p class="time-info" id="time-info"></p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const url = params.get('url') || '';
    try {
      const hostname = new URL(url).hostname.replace(/^www\./, '');
      document.getElementById('blocked-domain').textContent = hostname;
      document.getElementById('domain-favicon').src =
        `https://www.google.com/s2/favicons?domain=${hostname}&sz=32`;
      document.getElementById('domain-favicon').onerror = function() {
        this.style.display = 'none';
      };
    } catch (_) {
      document.getElementById('domain-favicon').style.display = 'none';
    }
    const now = new Date();
    document.getElementById('time-info').textContent =
      now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  </script>
</body>
</html>
