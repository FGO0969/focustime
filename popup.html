<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusTime</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Liquid Glass background -->
  <div class="bg-canvas">
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>
  </div>

  <!-- ────── VIEW: Lista de reglas ────── -->
  <div class="view active" id="view-list">
    <div class="navbar">
      <div class="navbar-left">
        <button class="btn-theme" id="btn-theme" title="Cambiar tema">🌙</button>
      </div>
      <div class="navbar-center">
        <span class="navbar-title">FocusTime</span>
      </div>
      <div class="navbar-right">
        <button class="btn-add" id="btn-new-rule" title="Nueva regla">+</button>
      </div>
    </div>

    <div class="scroll-area" id="rules-container"></div>
  </div>

  <!-- ────── VIEW: Formulario ────── -->
  <div class="view" id="view-form">
    <div class="navbar">
      <div class="navbar-left">
        <button class="btn-nav" id="btn-back">← Volver</button>
      </div>
      <div class="navbar-center">
        <span class="navbar-title" id="form-title">Nueva regla</span>
      </div>
      <div class="navbar-right">
        <button class="btn-nav bold" id="btn-save">Guardar</button>
      </div>
    </div>

    <div class="scroll-area">

      <div class="form-section">
        <div class="form-label">Sitio web</div>
        <div class="form-card">
          <div class="form-field">
            <span class="field-icon">🌐</span>
            <input class="form-input" id="input-domain" type="text"
              placeholder="ejemplo.com" autocomplete="off" spellcheck="false" />
          </div>
        </div>
        <div class="field-error" id="error-domain">Introduce un dominio válido</div>
      </div>

      <div class="form-section">
        <div class="form-label">Horarios de bloqueo</div>
        <div id="slots-container"></div>
        <div class="field-error" id="error-slots">Añade al menos un horario</div>
        <button class="btn-add-slot" id="btn-add-slot">
          <span style="font-size:18px;line-height:1">+</span>
          Añadir horario
        </button>
      </div>

      <div class="form-section">
        <button class="btn-primary" id="btn-save-bottom">Guardar regla</button>
      </div>

    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
